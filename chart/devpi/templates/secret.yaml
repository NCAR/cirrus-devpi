{{- if and .Values.devpi.rootPassword (not .Values.devpi.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devpi.fullname" . }}
  labels:
    {{- include "devpi.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ .Values.devpi.rootPassword | quote }}
{{- end }}
