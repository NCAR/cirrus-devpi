# Default values for the devpi chart.
# Override any of these with --set, -f, or your own values file.

replicaCount: 1  # devpi's server dir does not support concurrent writers; keep at 1

image:
  repository: hub.k8s.ucar.edu/cirrus-devpi/cirrus-devpi
  # Overrides the image tag. Defaults to the chart's appVersion when empty.
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 3141
  annotations: {}

# devpi runtime configuration
devpi:
  # Additional arguments passed to `devpi-server` (e.g. --restrict-modify, --no-root-pypi)
  extraArgs: []
  # Initial root password used by `devpi-init` on FIRST start only.
  # Changing it later has no effect on an already-initialized data directory.
  rootPassword: ""
  # Use an existing secret instead of creating one. The secret must contain
  # the password under the key `root-password`.
  existingSecret: ""

# Persistence: a PVC keeps the devpi server dir intact across restarts.
persistence:
  enabled: true
  # Name of the StorageClass to request. Leave empty ("") to use the
  # cluster's default StorageClass.
  storageClass: "ceph-kubepv"
  accessModes:
    - ReadWriteOnce
  size: 50Gi
  annotations: {}
  # Use an existing PVC instead of creating a new one.
  existingClaim: ""

ingress:
  enabled: true
  # IngressClass used for the Ingress object (e.g. nginx, traefik, haproxy)
  className: traefik-internal
  annotations:
    cert-manager.io/cluster-issuer: incommon
  hosts:
    - host: devpi.k8s.ucar.edu
      paths:
        - path: /
          pathType: Prefix
  # Example:
  tls:
    - secretName: devpi-tls
      hosts:
        - devpi.k8s.ucar.edu

# Use Recreate so the RWO volume can detach cleanly between pod replacements.
strategy:
  type: Recreate

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10


resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
